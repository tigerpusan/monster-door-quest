<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#16082f"><title>Monster Door Quest V0.5.2</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{display:grid;place-items:center}button{font:inherit}

.globalTools{position:absolute;top:max(env(safe-area-inset-top),14px);right:14px;z-index:20;display:flex;gap:10px}.circleTool{width:54px;height:54px;border:0;border-radius:18px;background:rgba(47,26,78,.9);color:#fff;font-size:1.6rem;backdrop-filter:blur(6px);border:1px solid rgba(205,170,255,.34);box-shadow:0 12px 24px rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center}

.countdownCard{margin-top:12px;border-radius:22px;padding:14px;border:1px solid rgba(211,166,255,.42);background:rgba(24,8,44,.88);box-shadow:0 10px 24px rgba(0,0,0,.24);text-align:center}.countdownCard span{display:block;color:#eed479}.countdownCard b{display:block;font-size:2.2rem;color:#ffeaa4;margin:4px 0 8px;text-shadow:0 0 18px rgba(255,205,106,.35)}
.timerTrack{height:12px;border-radius:999px;background:rgba(43,20,72,.8);overflow:hidden;border:1px solid rgba(244,196,74,.35)}.timerBar{height:100%;width:100%;background:linear-gradient(90deg,#f5c647,#ff91fe);box-shadow:0 0 16px rgba(247,197,85,.4)}
.primaryBtn,.secondaryBtn{border:0;cursor:pointer;font-weight:1000}.primaryBtn{width:100%;padding:18px 16px;border-radius:24px;background:linear-gradient(180deg,#9af75e,#63dd37);color:#0d240c;box-shadow:0 9px 0 #2b8f2a,0 16px 30px rgba(0,0,0,.28);font-size:1.13rem}.primaryBtn:active{transform:translateY(2px);box-shadow:0 6px 0 #2b8f2a,0 10px 18px rgba(0,0,0,.25)}.secondaryBtn{width:100%;padding:14px 14px;border-radius:20px;background:rgba(35,17,63,.92);color:#f0e7ff;border:1px solid rgba(151,110,212,.72)}.bottomFixedBtn{margin:14px 6px 0}.recordReady{text-align:center;padding:12px;border-radius:16px;background:#16304a;color:#bcecff;border:1px solid #2d6b94;font-weight:900;margin-top:10px}

.playHeader{padding:4px 6px 0}.playTimerWrap{margin:10px auto 0;width:min(82%,360px)}.playTimerPanel{padding:12px 14px;border-radius:24px;background:rgba(24,10,44,.92);border:1px solid rgba(240,206,94,.45);backdrop-filter:blur(6px);box-shadow:0 12px 28px rgba(0,0,0,.24)}.playTimerLabel{font-size:.9rem;color:#f1dd9d;text-align:center;text-shadow:0 2px 6px #000}.playTimerText{font-size:2rem;font-weight:1000;color:#ffe493;text-shadow:0 0 16px rgba(252,212,95,.4);text-align:center}.playTrack{margin-top:6px;height:10px}
.routeProgressWrap{margin:10px auto 0;width:min(88%,392px);padding:12px;border-radius:22px;background:rgba(20,8,42,.88);border:1px solid rgba(229,180,90,.36);backdrop-filter:blur(6px)}.routeProgressTitle{text-align:center;font-size:.92rem;color:#f1d36f;margin-bottom:8px}.routeProgress{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:nowrap;overflow:hidden}.progressNode{width:22px;height:22px;border-radius:50%;background:rgba(44,18,70,.92);border:2px solid rgba(223,188,98,.45);box-shadow:0 0 8px rgba(0,0,0,.3)}.progressNode.done{background:linear-gradient(180deg,#f7d36e,#d79d38);border-color:#fff0b5}.progressNode.current{background:linear-gradient(180deg,#8f68ff,#d48aff);border-color:#f5d582;transform:scale(1.15);animation:pulse 1s ease-in-out infinite}.progressNode.hero{display:grid;place-items:center;font-size:11px}
.doorScene{position:relative;flex:1;min-height:0;margin-top:8px}.heroGlow,.princessGlow{position:absolute;border-radius:50%;filter:blur(20px);pointer-events:none}.heroGlow{width:72px;height:72px;left:50%;transform:translateX(-50%);bottom:18%;background:rgba(255,202,85,.22)}.princessGlow{width:64px;height:64px;right:11%;top:17%;background:rgba(255,157,224,.22)}
.doorButton{position:absolute;top:24%;width:38%;height:54%;background:transparent;border:0;padding:0;cursor:pointer;perspective:1000px}.doorButton.left{left:6%}.doorButton.right{right:6%}.doorFrame{position:absolute;inset:0;border-radius:140px 140px 32px 32px;padding:12px;background:linear-gradient(180deg,#e2ba59,#905a17 48%,#f7d67e);box-shadow:0 0 0 2px rgba(255,220,150,.25),0 18px 28px rgba(0,0,0,.35)}
.doorLeafWrap{position:absolute;inset:12px;transform-style:preserve-3d;transition:transform .78s cubic-bezier(.2,.85,.18,1)}.doorButton.left .doorLeafWrap{transform-origin:left center}.doorButton.right .doorLeafWrap{transform-origin:right center}.doorLeaf{position:absolute;inset:0;border-radius:120px 120px 22px 22px;background:linear-gradient(180deg,#3a56d5,#16266e 78%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),inset 0 -24px 36px rgba(0,0,0,.2)}.doorButton.right .doorLeaf{background:linear-gradient(180deg,#a04ec7,#54197c 78%)}
.doorInnerGlow{position:absolute;inset:10px;border-radius:110px 110px 18px 18px;box-shadow:inset 0 0 32px rgba(255,255,255,.06),0 0 32px rgba(132,104,255,.16)}.doorKnob{position:absolute;top:58%;right:13%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe686,#d69828 58%,#91570f 100%);box-shadow:0 0 0 2px rgba(255,223,143,.25),0 0 18px rgba(255,200,80,.28)}.doorButton.right .doorKnob{left:13%;right:auto}.doorGem{position:absolute;top:16%;left:50%;transform:translateX(-50%) rotate(45deg);width:22px;height:22px;border:3px solid #e6c469;background:linear-gradient(180deg,#61d8ff,#2a6ed1);box-shadow:0 0 18px rgba(97,216,255,.35)}.doorButton.right .doorGem{background:linear-gradient(180deg,#f8a6ff,#a45dff)}
.doorBanner{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(19,9,39,.95);border:1px solid rgba(223,183,93,.35);box-shadow:0 8px 18px rgba(0,0,0,.3);font-weight:1000;white-space:nowrap}.doorBanner .arrowText{display:inline-flex;align-items:center;gap:4px;font-size:1.12rem}.doorBanner.left{color:#7ed8ff}.doorBanner.right{color:#ffb7ff}.bounceArrow{display:inline-block;animation:arrowLeft 1s ease-in-out infinite}.doorBanner.right .bounceArrow{animation-name:arrowRight}
.doorButton.open.left .doorLeafWrap{transform:rotateY(-78deg) translateX(-10px)}.doorButton.open.right .doorLeafWrap{transform:rotateY(78deg) translateX(10px)}.doorButton.correct .doorFrame{box-shadow:0 0 30px rgba(89,255,158,.42),0 18px 28px rgba(0,0,0,.35)}.doorButton.correct::after{content:'';position:absolute;inset:12px;border-radius:120px 120px 18px 18px;border:3px solid rgba(95,255,164,.8);animation:flash .55s ease}.doorButton.wrong{animation:shake .45s ease}.doorButton.wrong .doorFrame{box-shadow:0 0 30px rgba(255,88,116,.42),0 18px 28px rgba(0,0,0,.35)}
.doorFeedback{position:absolute;left:50%;top:-10px;transform:translate(-50%,-12px) scale(.88);display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:18px;border:1px solid rgba(255,255,255,.2);font-weight:1000;opacity:0;pointer-events:none;transition:all .28s ease;box-shadow:0 12px 18px rgba(0,0,0,.3)}.doorFeedback.show{opacity:1;transform:translate(-50%,-18px) scale(1)}.doorFeedback.success{background:rgba(20,91,58,.95);color:#c8ffe4;border-color:#70f0b1}.doorFeedback.fail{background:rgba(112,25,46,.95);color:#ffe0e6;border-color:#ff92ac}.doorFeedback .face{font-size:1.15rem}.feedback{position:absolute;left:0;right:0;bottom:7.2%;min-height:28px;text-align:center;font-weight:1000;font-size:1.2rem;color:#ffe37a;text-shadow:0 2px 12px #000}.feedback.success{color:#7dffb8}.feedback.fail{color:#ff8da5}

.resultScreen{background:radial-gradient(circle at 50% 12%,#4a247b,#1a0b34 42%,#090212 100%);justify-content:center;align-items:center;padding:24px 18px}.resultPanel{width:min(100%,430px);padding:28px 20px;border-radius:32px;background:linear-gradient(180deg,rgba(28,12,54,.96),rgba(14,5,29,.98));border:1px solid rgba(174,137,223,.55);box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}.resultPanel::before{content:'';position:absolute;inset:-30% auto auto -15%;width:80%;height:50%;background:radial-gradient(circle,rgba(255,224,120,.12),transparent 60%);transform:rotate(-18deg)}.resultTop{font-size:1.95rem;font-weight:1000;color:#ffcf46;position:relative;z-index:2}
.victorySeal,.failSeal{width:118px;height:118px;border-radius:50%;margin:0 auto;position:relative;display:grid;place-items:center;z-index:2}.victorySeal{background:radial-gradient(circle at 35% 30%,#fff0b7,#ffda64 40%,#a9621a 78%,#4b2305 100%);box-shadow:0 0 0 6px rgba(255,219,124,.16),0 0 36px rgba(255,203,88,.3);animation:floatY 2.2s ease-in-out infinite}.victorySeal::before{content:'⚔';font-size:2.4rem;color:#2b1444;text-shadow:0 2px 2px rgba(255,255,255,.35)}.victorySeal::after{content:'★';position:absolute;top:8px;right:14px;color:#fff2ab;font-size:1.2rem;animation:twinkle 1.2s ease-in-out infinite alternate}
.failSeal{background:radial-gradient(circle at 35% 30%,#ffdae0,#ff7c98 45%,#7a172d 85%,#35040d 100%);box-shadow:0 0 0 6px rgba(255,150,174,.14),0 0 36px rgba(255,90,122,.24)}.failSeal::before{content:'👾';font-size:3.6rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,.18))}
.resultTitle{font-size:2rem;font-weight:1000;position:relative;z-index:2}.resultSub{color:#dccff1;font-size:1rem;position:relative;z-index:2}.goalCard{width:100%;display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:8px;align-items:center;background:rgba(30,12,54,.72);border:1px solid rgba(155,111,215,.45);border-radius:22px;padding:14px;position:relative;z-index:2}.goalCard div{display:flex;flex-direction:column;gap:3px}.goalCard span{font-size:.75rem;color:#cfbee5}.goalCard b{font-size:1.55rem}.goalArrow{font-size:1.4rem!important;color:#ffcf46}
.mapBottomCard{margin-top:auto;padding:18px 16px 12px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,rgba(13,6,27,.25),rgba(16,8,31,.88) 18%,rgba(16,8,31,.97));backdrop-filter:blur(6px)}.mapStats{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px;border-radius:22px;background:rgba(20,10,42,.82);border:1px solid rgba(233,190,90,.3);text-align:center}.mapStats span{font-size:.78rem;color:#d7c6f5}.mapStats b{display:block;font-size:2rem;color:#ffe48b}.divider{width:1px;height:44px;background:linear-gradient(180deg,transparent,#f0ca65,transparent)}.mapStatus{text-align:center;font-weight:900;color:#eadfff;padding:12px 0 14px}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,213,130,.18)}50%{box-shadow:0 0 0 8px rgba(245,213,130,0)}}@keyframes arrowLeft{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}@keyframes arrowRight{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes twinkle{from{opacity:.45;transform:scale(.9)}to{opacity:1;transform:scale(1.15)}}
@media (max-height:770px){.memoryCard{padding-bottom:114px}.memoryTitle{font-size:1.3rem}.doorButton{top:26%;height:50%}.doorBanner{bottom:-12px;padding:8px 12px}}
</style></head><body><div id="app" class="app"><div class="globalTools"><button id="audioToggle" class="circleTool" aria-label="배경음 켜기 끄기">🔊</button></div>
<section id="intro" class="screen introScreen"><img class="introArtwork" src="./assets/start-hero.png" alt="문을 기억하여 몬스터에게 빼앗긴 공주를 되찾는 몬스터 문 열기 시작 화면"><button id="startBtn" class="artStartHit" aria-label="바로 시작"></button></section>
<section id="memory" class="screen sceneScreen hidden"><img class="backgroundArt" src="./assets/memory-scene.png" alt="기억 화면 배경"><div class="dimLayer"></div><div class="visualOverlay"><header class="topHud"><div class="hudPane"><div class="hudTitle">몬스터 문 열기</div><div id="memoryRank" class="hudSub">인간의 영역 I</div></div><div class="topBadges"><span id="memoryStage" class="badge">STAGE 3</span><span id="memoryBest" class="badge">BEST -</span></div></header><main class="memoryCard"><div class="memoryTitle">문 순서를 기억하세요</div><div id="routeList" class="routeList"></div><div id="countdownArea" class="countdownCard"><span>기억 시간</span><b id="timerText">5.0s</b><div class="timerTrack"><div id="timerBar" class="timerBar"></div></div></div><div id="recordReady" class="recordReady hidden">기록 도전 · 기억 시간 제한 없음</div></main><button id="readyBtn" class="primaryBtn bottomFixedBtn">기억 완료 · 도전!</button></div></section>
<section id="game" class="screen sceneScreen hidden"><img class="backgroundArt" src="./assets/game-scene.png" alt="게임 진행 배경"><div class="dimLayer"></div><div class="visualOverlay"><header class="topHud playHeader"><div class="hudPane"><div class="hudTitle">문을 여세요!</div><div id="gameRank" class="hudSub">인간의 영역 I</div></div><div class="topBadges"><span id="gameStage" class="badge">STAGE 3</span><span id="gameStep" class="badge">1 / 3</span></div></header><div class="playTimerWrap"><div class="playTimerPanel"><div class="playTimerLabel">입력 제한 시간</div><div id="playTimerText" class="playTimerText">10.0s</div><div class="timerTrack playTrack"><div id="playTimerBar" class="timerBar"></div></div></div></div><div class="routeProgressWrap"><div class="routeProgressTitle">진행 현황</div><div id="routeProgress" class="routeProgress"></div></div><main class="doorScene"><div class="princessGlow"></div><div class="heroGlow"></div><button id="leftDoor" class="doorButton left" aria-label="왼쪽 문 선택"><div class="doorFrame"><div class="doorLeafWrap"><div class="doorLeaf"><div class="doorInnerGlow"></div><div class="doorGem"></div><div class="doorKnob"></div></div></div></div><div id="leftDoorFeedback" class="doorFeedback"></div><div class="doorBanner left"><span class="bounceArrow">←</span><span class="arrowText">왼쪽</span></div></button><button id="rightDoor" class="doorButton right" aria-label="오른쪽 문 선택"><div class="doorFrame"><div class="doorLeafWrap"><div class="doorLeaf"><div class="doorInnerGlow"></div><div class="doorGem"></div><div class="doorKnob"></div></div></div></div><div id="rightDoorFeedback" class="doorFeedback"></div><div class="doorBanner right"><span class="arrowText">오른쪽</span><span class="bounceArrow">→</span></div></button><div id="feedback" class="feedback" aria-live="polite"></div></main></div></section>
<section id="clear" class="screen hidden resultScreen"><div class="resultPanel"><div class="resultTop">STAGE CLEAR!</div><div class="victorySeal"></div><div id="clearTitle" class="resultTitle">4 DOORS 성공!</div><div id="clearSub" class="resultSub">공주에게 한 걸음 더 가까워졌습니다.</div><div class="goalCard"><div><span>현재</span><b id="clearCurrent">4</b></div><div class="goalArrow">→</div><div><span>다음 목표</span><b id="clearNext">5</b></div><div><span>BEST</span><b id="clearBest">4</b></div></div><button id="nextBtn" class="primaryBtn">다음 도전</button><button id="mapBtn" class="secondaryBtn">진행 지도 보기</button></div></section>
<section id="fail" class="screen hidden resultScreen"><div class="resultPanel"><div class="resultTop">MONSTER ATTACK!</div><div class="failSeal"></div><div id="failTitle" class="resultTitle">몬스터 등장!</div><div id="failSub" class="resultSub">문 뒤에서 몬스터가 튀어나왔습니다.</div><button id="retryBtn" class="primaryBtn">다시 도전</button><button id="homeBtn" class="secondaryBtn">처음 화면</button></div></section>
<section id="map" class="screen sceneScreen hidden"><img class="backgroundArt" src="./assets/map-scene.png" alt="진행 지도 배경"><div class="dimLayer"></div><div class="visualOverlay"><div class="mapBottomCard"><div class="mapStats"><div><span>현재 STAGE</span><b id="mapCurrent">5</b></div><div class="divider"></div><div><span>BEST</span><b id="mapBest">5</b></div></div><div id="mapStatus" class="mapStatus">현재 STAGE 5 · BEST 5</div><button id="mapContinueBtn" class="primaryBtn">계속 도전</button><button id="closeMapBtn" class="secondaryBtn" style="margin-top:10px">결과 화면으로 돌아가기</button></div></div></section></div><script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const STORAGE = 'mdq-v052-overlap';
const PLAY_LIMIT_SECONDS = 10;
let state = loadState();
let engine = null; let memoryTimer = null; let playTimer = null;
let audioReady = false; let musicOn = true;
const audio = { ctx:null, loop:null, master:null };
function loadState(){ try{return Object.assign({ currentStage:3, bestStage:0 }, JSON.parse(localStorage.getItem(STORAGE)||'{}'));}catch{return { currentStage:3, bestStage:0 };} }
function saveState(){ localStorage.setItem(STORAGE, JSON.stringify(state)); }
function show(id){ $$('.screen').forEach(el=>el.classList.add('hidden')); $('#'+id).classList.remove('hidden'); }
function bestLabel(){ return state.bestStage > 0 ? state.bestStage : '-'; }
function stageConfig(stage){ const s=Math.max(1, Number(stage)||1); const countdown = s<=3?5.0:s<=5?4.5:s<=8?4.0:s<=11?3.5:s<=15?3.0:s<=20?2.5:null; const rank=s<=5?'인간의 영역 I':s<=10?'인간의 영역 II':s<=15?'인간의 영역 III':s<=20?'초인의 영역':s<=30?'기록의 영역':'신의 영역'; return { stage:s, doors:s, countdown, rank }; }
function stageTitle(stage){ const s=Number(stage); return s>=21 ? `RECORD ${s}` : `STAGE ${s}`; }
function maxRunForStage(stage){ return stage <= 4 ? 3 : 2; }
function createRoute(count, stage){ const route=[]; const maxRun=maxRunForStage(stage); for(let i=0;i<count;i++){ let pick=Math.random()<.5?'L':'R'; const recent=route.slice(-maxRun); if(recent.length===maxRun && recent.every(v=>v===pick)) pick = pick==='L' ? 'R' : 'L'; route.push(pick);} return route; }
class GameEngine{ constructor(stage){ this.stage=stage; this.config=stageConfig(stage); this.route=createRoute(this.config.doors, stage); this.currentStep=0; this.state='memory'; } begin(){ this.state='playing'; this.currentStep=0; } choose(side){ if(this.state!=='playing') return {status:this.state}; const expected=this.route[this.currentStep]; if(side!==expected){ this.state='fail'; return {status:'fail', index:this.currentStep, expected}; } this.currentStep += 1; if(this.currentStep>=this.route.length){ this.state='clear'; return {status:'clear'}; } return {status:'correct', index:this.currentStep}; }}
function setupAudio(){ if(audioReady) return; const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return; audio.ctx=new AC(); audio.master=audio.ctx.createGain(); audio.master.gain.value=0.065; audio.master.connect(audio.ctx.destination); audioReady=true; startMusic(); }
function resumeAudio(){ if(audio.ctx && audio.ctx.state==='suspended') audio.ctx.resume(); }
function tone(freq, when, dur, type='triangle', vol=.18){ if(!audioReady||!musicOn) return; const osc=audio.ctx.createOscillator(); const gain=audio.ctx.createGain(); osc.type=type; osc.frequency.setValueAtTime(freq, when); gain.gain.setValueAtTime(.0001, when); gain.gain.exponentialRampToValueAtTime(vol, when+0.04); gain.gain.exponentialRampToValueAtTime(.0001, when+dur); osc.connect(gain); gain.connect(audio.master); osc.start(when); osc.stop(when+dur+0.03);} 
function noiseHit(when,dur=.12,vol=.08){ if(!audioReady||!musicOn) return; const buffer=audio.ctx.createBuffer(1,audio.ctx.sampleRate*dur,audio.ctx.sampleRate); const data=buffer.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length); const src=audio.ctx.createBufferSource(); src.buffer=buffer; const filter=audio.ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=900; const gain=audio.ctx.createGain(); gain.gain.setValueAtTime(vol,when); gain.gain.exponentialRampToValueAtTime(.0001,when+dur); src.connect(filter); filter.connect(gain); gain.connect(audio.master); src.start(when); src.stop(when+dur); }
function startMusic(){ if(!audioReady||audio.loop) return; const seq=[196,220,247,220,174,196,220,196]; let step=0; const bar=()=>{ if(!musicOn) return; const t=audio.ctx.currentTime+0.03; tone(seq[step%seq.length],t,0.42,'triangle',.12); tone(seq[(step+2)%seq.length]/2,t,0.55,'sine',.06); if(step%2===0) tone(98,t,0.28,'sawtooth',.03); if(step%4===3) noiseHit(t+0.08,0.1,.03); step += 1; }; bar(); audio.loop=setInterval(bar,520); }
function setMusicState(on){ musicOn=on; $('#audioToggle').textContent=on?'🔊':'🔇'; if(audio.master){ audio.master.gain.cancelScheduledValues(audio.ctx.currentTime); audio.master.gain.linearRampToValueAtTime(on?0.065:0.0001,audio.ctx.currentTime+0.15);} }
function sfxOpen(){ if(!audioReady||!musicOn) return; const t=audio.ctx.currentTime; tone(430,t,0.12,'square',.08); tone(560,t+.05,0.16,'triangle',.05); }
function sfxCorrect(){ if(!audioReady||!musicOn) return; const t=audio.ctx.currentTime; tone(523,t,0.12,'triangle',.1); tone(659,t+.06,0.14,'triangle',.08); }
function sfxWrong(){ if(!audioReady||!musicOn) return; const t=audio.ctx.currentTime; tone(190,t,0.22,'sawtooth',.08); noiseHit(t,.18,.05); }
function sfxClear(){ if(!audioReady||!musicOn) return; const t=audio.ctx.currentTime; [523,659,784].forEach((f,i)=>tone(f,t+i*.08,0.2,'triangle',.1)); }
function resetDoors(){ $$('.doorButton').forEach(btn=>btn.classList.remove('open','correct','wrong')); $$('.doorFeedback').forEach(el=>{el.className='doorFeedback'; el.innerHTML='';}); }
function showDoorFeedback(side, kind, text){ const el = side==='L' ? $('#leftDoorFeedback') : $('#rightDoorFeedback'); el.className = `doorFeedback ${kind} show`; el.innerHTML = kind==='success' ? `<span class="face">✨</span><span>${text}</span>` : `<span class="face">👾</span><span>${text}</span>`; }
function renderMemory(){ const cfg=stageConfig(state.currentStage); $('#memoryStage').textContent=stageTitle(state.currentStage); $('#memoryBest').textContent=`BEST ${bestLabel()}`; $('#memoryRank').textContent=cfg.rank; const box=$('#routeList'); box.innerHTML=''; engine.route.forEach((side, idx)=>{ const item=document.createElement('div'); item.className=`routeItem ${side==='L'?'left':'right'}`; item.style.animationDelay=`${idx*25}ms`; item.innerHTML=`<span class="routeNum">${idx+1}</span><b>${side==='L'?'← 왼쪽':'오른쪽 →'}</b>`; box.appendChild(item);}); if(cfg.countdown==null){ $('#countdownArea').classList.add('hidden'); $('#recordReady').classList.remove('hidden'); } else { $('#countdownArea').classList.remove('hidden'); $('#recordReady').classList.add('hidden'); startMemoryCountdown(cfg.countdown); } show('memory'); }
function startMemoryCountdown(seconds){ clearInterval(memoryTimer); const total=seconds*1000; const started=performance.now(); const tick=()=>{ const remain=Math.max(0,total-(performance.now()-started)); $('#timerText').textContent=`${(remain/1000).toFixed(1)}s`; $('#timerBar').style.width=`${(remain/total)*100}%`; if(remain<=0){ clearInterval(memoryTimer); beginGame(); } }; tick(); memoryTimer=setInterval(tick,50); }
function renderStep(){ $('#gameStage').textContent=stageTitle(state.currentStage); $('#gameRank').textContent=stageConfig(state.currentStage).rank; $('#gameStep').textContent=`${Math.min(engine.currentStep+1, engine.route.length)} / ${engine.route.length}`; $('#feedback').textContent=''; $('#feedback').className='feedback'; resetDoors(); const progress=$('#routeProgress'); progress.innerHTML=''; engine.route.forEach((_,i)=>{ const dot=document.createElement('div'); dot.className=`progressNode ${i<engine.currentStep?'done':i===engine.currentStep?'current':'pending'} ${i===0?'hero':''}`; dot.textContent=i===0?'🧑':''; progress.appendChild(dot);}); }
function startPlayCountdown(){ clearInterval(playTimer); const total=PLAY_LIMIT_SECONDS*1000; const started=performance.now(); const tick=()=>{ const remain=Math.max(0,total-(performance.now()-started)); $('#playTimerText').textContent=`${(remain/1000).toFixed(1)}s`; $('#playTimerBar').style.width=`${(remain/total)*100}%`; $('#playTimerText').style.color = remain<=2500 ? '#ffb78f' : '#ffe493'; if(remain<=0){ clearInterval(playTimer); onTimeOver(); } }; tick(); playTimer=setInterval(tick,50); }
function beginGame(){ if(!engine||engine.state!=='memory') return; clearInterval(memoryTimer); engine.begin(); renderStep(); show('game'); startPlayCountdown(); }
function startChallenge(){ engine=new GameEngine(state.currentStage); renderMemory(); }
function chooseDoor(side){ if(!engine||engine.state!=='playing') return; const btn=side==='L'?$('#leftDoor'):$('#rightDoor'); sfxOpen(); btn.classList.add('open'); const result=engine.choose(side); if(result.status==='fail'){ btn.classList.add('wrong'); showDoorFeedback(side,'fail','몬스터!'); $('#feedback').textContent='실패!'; $('#feedback').classList.add('fail'); clearInterval(playTimer); sfxWrong(); setTimeout(()=>{ $('#failTitle').textContent='몬스터 등장!'; $('#failSub').textContent=`${result.index+1}번째 문에서 몬스터에게 막혔습니다.`; show('fail'); }, 760); return; } btn.classList.add('correct'); showDoorFeedback(side,'success','정답!'); $('#feedback').textContent='정답!'; $('#feedback').classList.add('success'); sfxCorrect(); if(result.status==='clear'){ clearInterval(playTimer); sfxClear(); setTimeout(onClear,780); } else { setTimeout(renderStep,720); } }
function onClear(){ const cleared=state.currentStage; state.bestStage=Math.max(state.bestStage, cleared); saveState(); $('#clearTitle').textContent=`${cleared} DOORS 성공!`; $('#clearSub').textContent = cleared===5?'인간의 영역 I 돌파!':cleared===10?'인간의 영역 II 돌파!':cleared===15?'인간의 영역 III 돌파!':cleared===20?'초인의 영역 돌파!':'공주에게 한 걸음 더 가까워졌습니다.'; $('#clearCurrent').textContent=cleared; $('#clearNext').textContent=cleared+1; $('#clearBest').textContent=state.bestStage; show('clear'); }
function onTimeOver(){ if(!engine||engine.state!=='playing') return; engine.state='fail'; sfxWrong(); $('#feedback').textContent='시간 초과!'; $('#feedback').classList.add('fail'); showDoorFeedback('L','fail','시간 끝'); showDoorFeedback('R','fail','시간 끝'); setTimeout(()=>{ $('#failTitle').textContent='시간 초과!'; $('#failSub').textContent=`10초 안에 ${engine.route.length}개의 문을 모두 열어야 합니다.`; show('fail'); }, 560); }
function nextStage(){ state.currentStage += 1; saveState(); startChallenge(); }
function renderMap(){ $('#mapCurrent').textContent=state.currentStage; $('#mapBest').textContent=bestLabel(); $('#mapStatus').textContent=`현재 STAGE ${state.currentStage} · BEST ${bestLabel()}`; show('map'); }
$('#startBtn').addEventListener('click',()=>{setupAudio(); resumeAudio(); startChallenge();}); $('#audioToggle').addEventListener('click',()=>{ if(!audioReady){ setupAudio(); resumeAudio(); } setMusicState(!musicOn); }); $('#readyBtn').addEventListener('click',()=>{ if(audioReady) resumeAudio(); beginGame(); }); $('#leftDoor').addEventListener('click',()=>{ if(audioReady) resumeAudio(); chooseDoor('L'); }); $('#rightDoor').addEventListener('click',()=>{ if(audioReady) resumeAudio(); chooseDoor('R'); }); $('#nextBtn').addEventListener('click',()=>{ if(audioReady) resumeAudio(); nextStage(); }); $('#retryBtn').addEventListener('click',()=>{ if(audioReady) resumeAudio(); startChallenge(); }); $('#mapBtn').addEventListener('click',renderMap); $('#mapContinueBtn').addEventListener('click',()=>{ if(audioReady) resumeAudio(); startChallenge(); }); $('#closeMapBtn').addEventListener('click',()=>show('clear')); $('#homeBtn').addEventListener('click',()=>show('intro')); show('intro');
</script></body></html>
