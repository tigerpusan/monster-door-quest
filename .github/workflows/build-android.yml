name: Build & Release MonsterDoor Background Rebuild Final

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          rm -rf /tmp/monsterdoor_platform
          flutter create --platforms=android --org com.tigerpusan --project-name monsterdoor /tmp/monsterdoor_platform
          rm -rf android
          cp -R /tmp/monsterdoor_platform/android ./android

      - name: Set app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8').replace('android:label="monsterdoor"','android:label="MonsterDoor"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply launcher icon
        run: |
          cp assets/app_icon/mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app_icon/hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app_icon/xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app_icon/xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app_icon/xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Clean build cache
        run: flutter clean

      - name: Dependencies
        run: flutter pub get

      - name: Verify final background sources
        run: |
          test -f assets/images/ui/gameplay_final_clean_v2.png
          test -f assets/images/ui/stage_clear_final_clean_v2.png
          grep -q "ui/gameplay_final_clean_v2.png" lib/game/scenes/intro_scene.dart
          grep -q "ui/gameplay_final_clean_v2.png" lib/game/scenes/memory_scene.dart
          grep -q "ui/stage_clear_final_clean_v2.png" lib/game/scenes/result_scene.dart
          ! grep -q "ui/gameplay.webp" lib/game/scenes/intro_scene.dart
          ! grep -q "ui/gameplay.webp" lib/game/scenes/memory_scene.dart
          ! grep -q "ui/stage_clear.webp" lib/game/scenes/result_scene.dart
          echo "Verified unique final background assets and scene references."

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MonsterDoor-background-rebuild-final.apk

      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: MonsterDoor-background-rebuild-final-apk
          path: MonsterDoor-background-rebuild-final.apk
          if-no-files-found: error

      - name: Replace previous background rebuild release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete background-rebuild-final --yes --cleanup-tag || true

      - name: Create direct APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create background-rebuild-final MonsterDoor-background-rebuild-final.apk \
            --title "MonsterDoor Background Rebuild Final" \
            --notes "Final background-source rebuild: unique clean gameplay/result assets, direct scene references, overlap cleanup, and unambiguous APK filename/version 7.2.1." \
            --prerelease
