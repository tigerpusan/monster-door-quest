name: Build MonsterDoor Android V0.6.1

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create unique MonsterDoor Android scaffold
        run: |
          rm -rf /tmp/monsterdoor_platform
          flutter create \
            --platforms=android \
            --org com.tigerpusan \
            --project-name monsterdoor \
            /tmp/monsterdoor_platform

          rm -rf android
          cp -R /tmp/monsterdoor_platform/android ./android

      - name: Set Android app label to 몬스터door
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="monsterdoor"', 'android:label="몬스터door"')
          p.write_text(s)
          PY

      - name: Apply MonsterDoor launcher icon
        run: |
          cp assets/app_icon/mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app_icon/hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app_icon/xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app_icon/xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app_icon/xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with app name and version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MonsterDoor-v0.6.1-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonsterDoor-v0.6.1-release-apk
          path: MonsterDoor-v0.6.1-release.apk
          if-no-files-found: error
