name: Build & Release MonsterDoor APK V0.7.0

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set MonsterDoor version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text(encoding="utf-8")
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if line.startswith("version:"):
                  lines[i] = "version: 0.7.0+70"
                  break
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Create MonsterDoor Android scaffold
        shell: bash
        run: |
          rm -rf /tmp/monsterdoor_platform
          flutter create \
            --platforms=android \
            --org com.tigerpusan \
            --project-name monsterdoor \
            /tmp/monsterdoor_platform

          rm -rf android
          cp -R /tmp/monsterdoor_platform/android ./android

      - name: Set Android app label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('android:label="monsterdoor"', 'android:label="MonsterDoor"')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Apply MonsterDoor launcher icon
        shell: bash
        run: |
          cp assets/app_icon/mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app_icon/hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app_icon/xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app_icon/xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app_icon/xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare named APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             MonsterDoor-v0.7.0-release.apk
          ls -lh MonsterDoor-v0.7.0-release.apk

      - name: Upload build artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: MonsterDoor-v0.7.0-release-apk-backup
          path: MonsterDoor-v0.7.0-release.apk
          if-no-files-found: error

      - name: Replace existing test release tag if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.7.0-test --yes --cleanup-tag || true

      - name: Create GitHub Release with direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0-test \
            MonsterDoor-v0.7.0-release.apk \
            --title "MonsterDoor V0.7.0 Test Build" \
            --notes "Android release APK test build. App: MonsterDoor / Package: com.tigerpusan.monsterdoor / Version: 0.7.0 (70)" \
            --prerelease
