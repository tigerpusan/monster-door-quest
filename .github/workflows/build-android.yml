name: Build & Release MonsterDoor Verified Patch

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          rm -rf /tmp/monsterdoor_platform
          flutter create --platforms=android --org com.tigerpusan --project-name monsterdoor /tmp/monsterdoor_platform
          rm -rf android
          cp -R /tmp/monsterdoor_platform/android ./android

      - name: Set app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8').replace('android:label="monsterdoor"','android:label="MonsterDoor"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply launcher icon
        run: |
          cp assets/app_icon/mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app_icon/hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app_icon/xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app_icon/xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app_icon/xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MonsterDoor-verified-final-fix.apk

      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: MonsterDoor-verified-final-fix-apk
          path: MonsterDoor-verified-final-fix.apk
          if-no-files-found: error

      - name: Replace previous verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete verified-final-fix --yes --cleanup-tag || true

      - name: Create direct APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create verified-final-fix MonsterDoor-verified-final-fix.apk \
            --title "MonsterDoor Verified Final Fix" \
            --notes "Verified patch: overlap removal, simplified result screen, no fluorescent door outline, O/X feedback, pooled low-latency door audio, and short haptics for fast stages." \
            --prerelease
