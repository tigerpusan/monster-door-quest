name: Build & Release Door Mission Pixel V5

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          rm -rf /tmp/monsterdoor_platform
          flutter create --platforms=android --org com.tigerpusan --project-name monsterdoor /tmp/monsterdoor_platform
          rm -rf android
          cp -R /tmp/monsterdoor_platform/android ./android

      - name: Set app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8').replace('android:label="monsterdoor"','android:label="문대작전"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply launcher icon
        run: |
          cp assets/app_icon/mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/app_icon/hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/app_icon/xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/app_icon/xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/app_icon/xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Clean build cache
        run: flutter clean

      - name: Dependencies
        run: flutter pub get

      - name: Verify V5 image-driven sources
        shell: bash
        run: |
          set -e
          test -f assets/images/ui/v5/intro_template.png
          test -f assets/images/ui/v5/memory_template.png
          test -f assets/images/ui/v5/clear_template.png
          test -f assets/images/ui/v5/settings_template.png
          test -f assets/images/ui/v5/fail_template.png
          test -f lib/game/ui/v5_image_ui.dart
          grep -q "V5ImageUI" lib/game/scenes/intro_scene.dart
          grep -q "V5ImageUI" lib/game/scenes/memory_scene.dart
          grep -q "V5ImageUI" lib/game/scenes/result_scene.dart
          grep -q "bgmEnabled" lib/game/ui/game_help_overlay.dart
          echo "V5 image-driven UI and BGM toggle wiring verified."

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DoorMission-Pixel-V5.apk

      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: DoorMission-Pixel-V5-apk
          path: DoorMission-Pixel-V5.apk
          if-no-files-found: error

      - name: Replace previous V5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete door-mission-pixel-v5 --yes --cleanup-tag || true

      - name: Create direct APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create door-mission-pixel-v5 DoorMission-Pixel-V5.apk \
            --title "문대작전 Pixel V5" \
            --notes "V5 image-driven UI: final concept-art screens used as live templates, dynamic stage/time overlays, fixed door scene spacing, responsive memory rows, active BGM toggle." \
            --prerelease
