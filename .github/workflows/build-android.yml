name: Build & Release Door Mission Pixel V6.3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "test/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          rm -rf /tmp/monsterdoor_platform
          flutter create \
            --platforms=android \
            --org com.tigerpusan \
            --project-name monsterdoor \
            /tmp/monsterdoor_platform

          rm -rf android
          cp -R /tmp/monsterdoor_platform/android ./android

      - name: Set app label
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'android:label="monsterdoor"',
              'android:label="문대작전"'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply launcher icon
        run: |
          cp assets/app_icon/mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp assets/app_icon/hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp assets/app_icon/xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp assets/app_icon/xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp assets/app_icon/xxxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Clean build cache
        run: flutter clean

      - name: Dependencies
        run: flutter pub get

      - name: Verify V6.3 sources
        shell: bash
        run: |
          set -e

          echo "Checking V6.3 source files..."

          test -f pubspec.yaml

          test -f lib/game/scenes/intro_scene.dart
          test -f lib/game/scenes/memory_scene.dart
          test -f lib/game/scenes/door_scene.dart
          test -f lib/game/scenes/result_scene.dart

          test -f lib/game/ui/game_help_overlay.dart

          test -f assets/images/ui/v5/intro_template.png
          test -f assets/images/ui/v5/fail_template.png

          test -f assets/images/ui/v6/memory_template.png
          test -f assets/images/ui/v6/clear_template.png
          test -f assets/images/ui/v6/settings_template.png

          echo "V6.3 micro-layout and fixed-art source files verified."

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare named APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            DoorMission-Pixel-V6.3.apk

      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: DoorMission-Pixel-V6.3-apk
          path: DoorMission-Pixel-V6.3.apk
          if-no-files-found: error

      - name: Replace previous V6.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete door-mission-pixel-v6-3 \
            --yes \
            --cleanup-tag || true

      - name: Create direct APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            door-mission-pixel-v6-3 \
            DoorMission-Pixel-V6.3.apk \
            --title "문대작전 Pixel V6.3 · Micro Layout Fix" \
            --notes "V6.3 micro-layout release: fixed memory-screen spacing, removed unnecessary memory-screen line, adjusted settings stage/high-score positioning, preserved fixed-art UI, touch controls, BGM controls, restart and continue behavior." \
            --prerelease
