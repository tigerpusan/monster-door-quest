<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Monster Door Quest V0.1</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div class="app">
  <section id="home" class="screen">
    <div class="top">
      <div class="brand" data-t="title">몬스터 문 열기</div>
      <select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">EN</option><option value="zh">中文</option></select>
    </div>
    <div class="heroPanel homeScene">
      <div class="moon">🌙</div>
      <div class="castleEmoji">🏰</div>
      <h1>MONSTER<br>DOOR QUEST</h1>
      <p data-t="subtitle">길을 기억하고 공주를 구하라</p>
      <div id="homeBest" class="best">최고 기록 3 DOORS</div>
    </div>
    <button id="startGame" class="cta" data-t="start">GAME START</button>
  </section>

  <section id="memory" class="screen hidden">
    <div class="top">
      <div class="brand" data-t="title">몬스터 문 열기</div>
      <div class="stageBadge"></div>
    </div>
    <div class="heroPanel memoryWrap">
      <div class="title"><h2 id="memoryTitle">길을 기억하세요!</h2><p id="memoryHint"></p><div class="realmLabel"></div></div>
      <div id="memoryRoute" class="memoryRoute"></div>
      <div class="timer"><div class="track"><div id="memoryBar" class="bar"></div></div><div id="memorySeconds" class="seconds"></div></div>
    </div>
    <button id="memoryGo" class="cta" disabled>기억 완료 · 공주를 구하러 가기</button>
  </section>

  <section id="game" class="screen hidden">
    <div class="top">
      <div class="brand" data-t="title">몬스터 문 열기</div>
      <div class="stageBadge"></div>
    </div>
    <div class="heroPanel gamePanel">
      <div class="title"><h2 data-t="choose">기억한 문을 여세요!</h2><div class="realmLabel"></div></div>
      <div><div id="progressDots" class="progressDots"></div><div style="text-align:center;font-weight:1000"><span id="stepCounter">1 / 3</span></div></div>
      <div class="doors">
        <button id="leftDoor" class="doorBtn"><span class="doorFrame"></span><span class="doorLabel left" data-t="left">왼쪽</span></button>
        <button id="rightDoor" class="doorBtn"><span class="doorFrame"></span><span class="doorLabel right" data-t="right">오른쪽</span></button>
      </div>
      <div><div id="feedback" class="feedback"></div><div class="hero">🛡️🤴⚔️</div></div>
    </div>
    <div></div>
  </section>

  <section id="clear" class="screen overlay hidden">
    <div class="big">🤴💖👸</div>
    <h2 data-t="clear">STAGE CLEAR!</h2>
    <p data-t="saved">공주를 구했습니다!</p>
    <div class="actions"><button id="nextBtn" class="cta" data-t="next">NEXT STAGE</button><button id="clearHome" class="secondary">HOME</button></div>
  </section>

  <section id="fail" class="screen overlay failBg hidden">
    <div class="big">👹</div>
    <h2 data-t="fail">MONSTER!</h2>
    <p data-t="captured">잘못된 문입니다. 몬스터가 공주를 잡아갔습니다.</p>
    <div id="failAt" class="failAt"></div>
    <div class="actions"><button id="retryBtn" class="cta" data-t="retry">다시 도전</button><button id="failHome" class="secondary">HOME</button></div>
  </section>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
