name: monster_door_quest
description: Door Mission Pixel V6 fixed-art-layer memory game
publish_to: "none"
version: 7.5.0+750

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/ui/
    - assets/images/ui/v5/
    - assets/images/ui/v6/
    - assets/audio/bgm/
    - assets/audio/sfx/
